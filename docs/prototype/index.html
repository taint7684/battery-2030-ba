<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battery 2030 — Prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">B</span><div><b>Battery 2030</b><small>Nền tảng vòng đời pin · VELIX (giả định)</small></div></div>
  <div class="who">
    <label>Người dùng (demo)
      <select id="user" data-testid="user-select"></select>
    </label>
    <label class="net"><input type="checkbox" id="offline" data-testid="offline-toggle"> Mất kết nối</label>
    <button type="button" id="reset" class="ghost" data-testid="reset">Đặt lại dữ liệu</button>
  </div>
</header>
<div class="banner">Dữ liệu giả lập (synthetic), thu nhỏ 1:100. Ngày hệ thống: <b id="today"></b>. Không phải hệ thống thật.</div>
<div class="layout">
  <nav id="nav" aria-label="Chức năng"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="domain.js"></script>
<script src="app.js"></script>
</body>
</html>
