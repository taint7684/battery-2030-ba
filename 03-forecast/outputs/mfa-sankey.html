<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dòng pin hết hạn 2030</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--line:#e4e3df}
body{margin:0;background:var(--surface);color:var(--ink);font:14px system-ui,Segoe UI,Arial,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 4px} p{color:var(--ink2);margin:0 0 12px;max-width:80ch}
.bar{display:flex;gap:8px;margin:8px 0}
button{font:inherit;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
button[aria-pressed=true]{background:#2a78d6;color:#fff;border-color:#2a78d6}
#chart{width:100%;max-width:1060px;height:500px}
table{border-collapse:collapse;font-size:13px;margin-top:12px} td,th{border-bottom:1px solid var(--line);padding:4px 10px;text-align:left} td.n{text-align:right}
</style></head><body>
<h1>Pin hết hạn năm 2030 đi đâu? (nghìn tấn, giá trị likely)</h1>
<p>Nguồn: mô hình S9 (03-forecast/model/forecast.py). Tỷ lệ thu hồi chính thức theo ASM-11, tỷ lệ đời thứ hai theo ASM-10. Phần phi chính thức là ước lượng theo khoảng, không quan sát được trực tiếp.</p>
<div class="bar" role="group" aria-label="Kịch bản"><button type="button" data-sc="Chậm" aria-pressed="false">Chậm</button><button type="button" data-sc="Cơ sở" aria-pressed="false">Cơ sở</button><button type="button" data-sc="Nhanh" aria-pressed="false">Nhanh</button></div>
<div id="chart"></div>
<table id="tbl"><thead><tr><th>Dòng</th><th>Từ</th><th>Đến</th><th>nghìn tấn</th></tr></thead><tbody></tbody></table>
<script>
const DATA = {"Chậm": {"year": 2030, "unit": "tấn", "nodes": ["Hết hạn: e2W-Li", "Thu hồi chính thức", "Phi chính thức / thất thoát", "Đời thứ hai", "Hết hạn: e2W-Chì", "Hết hạn: Ô tô-Li", "Tái chế có phép"], "links": [{"source": 0, "target": 1, "value": 2078.2}, {"source": 0, "target": 2, "value": 3859.5}, {"source": 1, "target": 3, "value": 727.4}, {"source": 4, "target": 1, "value": 9114.6}, {"source": 4, "target": 2, "value": 24029.5}, {"source": 5, "target": 1, "value": 2181.6}, {"source": 5, "target": 2, "value": 4051.5}, {"source": 1, "target": 3, "value": 1199.9}, {"source": 1, "target": 6, "value": 11447.2}], "placed_on_market_t": 129910.9, "stock_units": 7868348}, "Cơ sở": {"year": 2030, "unit": "tấn", "nodes": ["Hết hạn: e2W-Li", "Thu hồi chính thức", "Phi chính thức / thất thoát", "Đời thứ hai", "Hết hạn: e2W-Chì", "Hết hạn: Ô tô-Li", "Tái chế có phép"], "links": [{"source": 0, "target": 1, "value": 2386.5}, {"source": 0, "target": 2, "value": 4432.1}, {"source": 1, "target": 3, "value": 835.3}, {"source": 4, "target": 1, "value": 9061.3}, {"source": 4, "target": 2, "value": 23888.9}, {"source": 5, "target": 1, "value": 2371.1}, {"source": 5, "target": 2, "value": 4403.5}, {"source": 1, "target": 3, "value": 1304.1}, {"source": 1, "target": 6, "value": 11679.6}], "placed_on_market_t": 159537.4, "stock_units": 9326724}, "Nhanh": {"year": 2030, "unit": "tấn", "nodes": ["Hết hạn: e2W-Li", "Thu hồi chính thức", "Phi chính thức / thất thoát", "Đời thứ hai", "Hết hạn: e2W-Chì", "Hết hạn: Ô tô-Li", "Tái chế có phép"], "links": [{"source": 0, "target": 1, "value": 2874.6}, {"source": 0, "target": 2, "value": 5338.5}, {"source": 1, "target": 3, "value": 1006.1}, {"source": 4, "target": 1, "value": 8989.4}, {"source": 4, "target": 2, "value": 23699.3}, {"source": 5, "target": 1, "value": 2573.1}, {"source": 5, "target": 2, "value": 4778.5}, {"source": 1, "target": 3, "value": 1415.2}, {"source": 1, "target": 6, "value": 12015.7}], "placed_on_market_t": 197885.5, "stock_units": 11702347}};
const COLOR = {"Hết hạn: e2W-Li":"#2a78d6","Hết hạn: e2W-Chì":"#eb6834","Hết hạn: Ô tô-Li":"#1baf7a",
  "Thu hồi chính thức":"#52514e","Phi chính thức / thất thoát":"#a8a7a1","Đời thứ hai":"#1baf7a","Tái chế có phép":"#2a78d6"};
const POS = {"Hết hạn: e2W-Chì":[0.001,0.2],"Hết hạn: e2W-Li":[0.001,0.62],"Hết hạn: Ô tô-Li":[0.001,0.88],
  "Thu hồi chính thức":[0.42,0.72],"Phi chính thức / thất thoát":[0.999,0.25],"Tái chế có phép":[0.999,0.74],"Đời thứ hai":[0.999,0.95]};
const LABEL = s => s.replace("e2W-Li","Xe máy pin Li").replace("e2W-Chì","Xe máy ắc quy chì").replace("Ô tô-Li","Ô tô pin Li");
function draw(sc){
  const d = DATA[sc];
  document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.sc===sc));
  const lab = d.nodes.map(LABEL);
  Plotly.react('chart',[{type:'sankey',arrangement:'fixed',
    node:{label:lab,x:d.nodes.map(n=>POS[n][0]),y:d.nodes.map(n=>POS[n][1]),color:d.nodes.map(n=>COLOR[n]||'#52514e'),pad:18,thickness:16,line:{width:0}},
    link:{source:d.links.map(l=>l.source),target:d.links.map(l=>l.target),value:d.links.map(l=>l.value/1000),
      color:d.links.map(l=>(COLOR[d.nodes[l.source]]||'#999')+'55'),
      hovertemplate:'%{source.label} → %{target.label}<br>%{value:.1f} nghìn tấn<extra></extra>'}}],
    {margin:{l:8,r:8,t:8,b:8},font:{size:13,color:'#0b0b0b'},paper_bgcolor:'#fcfcfb'},{displayModeBar:false,responsive:true});
  document.querySelector('#tbl tbody').innerHTML = d.links.map((l,i)=>`<tr><td>${i+1}</td><td>${lab[l.source]}</td><td>${lab[l.target]}</td><td class="n">${(l.value/1000).toFixed(1).replace('.',',')}</td></tr>`).join('');
}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>draw(b.dataset.sc));
draw('Cơ sở');
</script></body></html>
